services:
  wireguard-client:
    image: "${WG_RESILIENT_IMAGE:-criogaid/wg-resilient:latest}"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    environment:
      ROLE: client
      WG_INTERFACE: "${WG_INTERFACE:-wg0}"
      UDP2RAW_REMOTE_HOST: "${UDP2RAW_REMOTE_HOST:?set UDP2RAW_REMOTE_HOST in .env}"
      UDP2RAW_PASSWORD: "${UDP2RAW_PASSWORD:-}"
      UDP2RAW_PASSWORD_FILE: "${UDP2RAW_PASSWORD_FILE:-}"
      UDP2RAW_PORT: "${UDP2RAW_PORT:-4096}"
      SPEEDER_ENABLED: "${SPEEDER_ENABLED:-false}"
      SPEEDER_FEC: "${SPEEDER_FEC:-20:10}"
      SPEEDER_MTU: "${SPEEDER_MTU:-1250}"
      SPEEDER_TIMEOUT: "${SPEEDER_TIMEOUT:-8}"
    volumes:
      - ./config/client/wg0.conf:/config/wg0.conf:ro
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
